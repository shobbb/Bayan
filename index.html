<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Home-screen install metadata. Inert inside the Capacitor WebView, which
      serves these same assets locally — it is here so the hosted build can be
      installed to a phone home screen as a test surface (REQ-P1: the browser is
      a development surface, not a product phase). No service worker: the native
      shell already has the assets on disk, and a cached shell would fight
      over-the-air bundle updates.
    -->
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      iOS resolves the home-screen icon once, when the page is added, and never
      revisits it — a fetch that failed at that moment is cached as a generated
      monogram indefinitely. The version query defeats a stale or negative cache
      entry; bump it whenever the artwork changes. -precomposed is for older
      iOS, which looks for that name first.

      Served from the public repo rather than from this origin: the hosted build
      sits behind Netlify access control so the API key baked into the bundle is
      not readable, and iOS's icon fetch does not reliably carry the session
      cookie that gets past it. The icon is the one asset here with nothing to
      protect, so it is the one that can live somewhere unauthenticated. HEAD
      tracks the default branch, so this follows the artwork without pinning.

      Only the install-time icon points off-origin. Everything the running app
      needs is bundled (REQ-D4) — nothing here makes the app depend on the
      network at runtime, and it is inert in the Capacitor WebView, which uses
      the platform's own icon assets.
    -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://raw.githubusercontent.com/shobbb/Bayan/HEAD/public/apple-touch-icon.png?v=2"
    />
    <link
      rel="apple-touch-icon-precomposed"
      sizes="180x180"
      href="https://raw.githubusercontent.com/shobbb/Bayan/HEAD/public/apple-touch-icon.png?v=2"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bayan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)" />

    <title>Bayan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
