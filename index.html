<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Home-screen install metadata. Inert inside the Capacitor WebView, which
      serves these same assets locally — it is here so the hosted build can be
      installed to a phone home screen as a test surface (REQ-P1: the browser is
      a development surface, not a product phase). No service worker: the native
      shell already has the assets on disk, and a cached shell would fight
      over-the-air bundle updates.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      iOS resolves the home-screen icon once, when the page is added, and then
      never revisits it — so a fetch that failed at that moment is cached as a
      generated monogram forever. The version query defeats a stale or negative
      HTTP cache entry for the icon; bump it whenever the artwork changes.
      -precomposed is for older iOS, which looks for that name first.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bayan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)" />

    <title>Bayan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
